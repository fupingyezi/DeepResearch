# 部署目标：/etc/nginx/conf.d/deepresearch.conf（apt 安装的 nginx）
# Phase 0：app/api 两域名指向同一实例（127.0.0.1:3000）；
# Phase 1 前后端分离后，api server 的 proxy_pass 改指 api 实例端口。
# 首次签发：先注释掉两个 443 块，80 放行后执行
#   sudo certbot --nginx -d app.example.com -d api.example.com
# certbot 会自动补 443 块与证书路径；两个 server 块共用同一张 SAN 证书。
server {
    listen 80;    # 监听明文 HTTP 的默认端口。浏览器输入 app.example.com 不带协议时默认走 80
    server_name app.example.com; #只处理 Host 是这个域名的请求。

    location /.well-known/acme-challenge/ { #  Let's Encrypt 签证书用，必须在跳转规则之前，且不能被 301 吃掉，否则证书永远签不下来。
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;   # https://app.example.com/login?next=/chat
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate         /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;

    # HSTS 起步 30 天，验证无误后加长到半年以上
    add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;

    # SSE 必须关缓冲：事件帧攒在代理缓冲区里，前端就收不到增量 token
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate         /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}