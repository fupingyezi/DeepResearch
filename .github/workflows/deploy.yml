# 端到端流水线：质量门禁 → 传源码包 → 服务器本地构建镜像并部署（失败自动回滚）。
# 镜像分发历史方案与死因（2026-09 实测）：
#   ① scp 直传镜像 tar —— 跨境 20 分钟 0 字节卡死
#   ② push 腾讯云 TCR —— 层全部推完，最后的 manifest PUT 稳定挂起（带超时重试 5 次无果）
# 终方案（Plan B）：CI 只传源码包（git archive，~0.5MB），docker build 全程在
# 服务器本地完成（基础镜像经腾讯内网 mirror 拉取），零跨境镜像流量。
# 触发：push/PR 到 main 均跑质量门禁；仅 push main 才触发部署 job。
# Secrets（仅 SSH 连接凭证，业务密钥留在服务器 .env.production）：
#   SSH_HOST / SSH_USER / SSH_KEY / SSH_PORT(可选,默认22) / DEPLOY_PATH
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支新提交取消旧运行，节省额度
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── job1：质量门禁（本地钩子同款校验，标准一致）──
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (占位)
        run: pnpm test

      - name: Build
        run: pnpm build

  # ── job2：传源码到服务器，本地构建并部署（仅 push main，质量门禁通过后）──
  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        # 服务器本地镜像，无 registry 前缀；tag 用 git 短 sha 便于回滚定位
        run: echo "tag=deepresearch:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Pack source
        # git archive 只含 git 跟踪的文件（node_modules/.next/.env* 天然排除）
        run: git archive --format=tar.gz -o source.tar.gz HEAD

      - name: Upload source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: source.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Build & deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # 服务器端 docker build：首次需拉基础镜像 + pnpm install + next build，
          # 可能 10 分钟+；后续 layer 缓存命中会明显变快。command_timeout 需放宽
          command_timeout: 40m
          # 远程执行：解包源码 → docker build → 起服务 → 健康检查 → 失败自动回滚
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            tar -xzf source.tar.gz
            rm -f source.tar.gz
            chmod +x scripts/*.sh
            bash scripts/deploy-remote.sh "${{ steps.meta.outputs.tag }}"
